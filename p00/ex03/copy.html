<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>copy</title>
        <link href="style.css" rel="stylesheet">   
    </head>
    <body>
        <ol>
            <li>
                <h2>Frontend</h2>

                <p style="--progresstool-width: 100%;">
                    <label style="display: block; position: relative;">
                        HTML5
                        <span style="position: absolute; left: 80%;">80%</span>
                    </label>
                    <progress id="html5" class="html5" max="100" value="80"></progress>
                </p>

                <p style="--progresstool-width: 100%;">
                    <label style="display: block; position: relative;">
                        CSS3
                        <span style="position: absolute; left: 60%;">60%</span>
                    </label>
                    <progress id="css3" class="css3" max="100" value="60"></progress>
                </p>

                <p style="--progresstool-width: 100%;">
                    <label style="display: block; position: relative;">
                        jQuery
                        <span style="position: absolute; left: 50%;">50%</span>
                    </label>
                    <progress id="jquery" class="jquery" max="100" value="50"></progress>
                </p>
            </li>

            <li>
                <h2>Backend</h2>

                <p style="--progresstool-width: 100%;">
                    <label style="display: block; position: relative;">
                        Python
                        <span style="position: absolute; left: 75%;">75%</span>
                    </label>
                    <progress id="python" class="python" max="100" value="75"></progress>
                </p>

                <p style="--progresstool-width: 100%;">
                    <label style="display: block; position: relative;">
                        PHP
                        <span style="position: absolute; left: 65%;">65%</span>
                    </label>
                    <progress id="php" class="php" max="100" value="65"></progress>
                </p>

                <p style="--progresstool-width: 100%;">
                    <label style="display: block; position: relative;">
                        Node.js
                        <span style="position: absolute; left: 35%;">35%</span>
                    </label>
                    <progress id="node-js" class="node-js" max="100" value="35"></progress>
                </p>
            </li>
        </ol>
    </body>
</html>
